<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi curso — Raabta Beauty Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fdf7ef; --ink:#3f3126; --brown:#633b2c; --gold:#a47234; --cream:#f7ecdf; --muted:#7a685d; --line:#f0e4d3; --border:#ecdcc6; --serif:'Hedvig Letters Serif',serif; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',sans-serif;background:var(--bg);color:var(--ink)}
  a{color:#986a3e;text-decoration:none}
  a:hover{color:var(--brown)}
  h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--brown);margin:0}
  button{font-family:inherit}
  header{position:sticky;top:0;z-index:50;background:rgba(253,247,239,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .header-inner{max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  nav{display:flex;gap:8px;align-items:center}
  nav a{padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--brown)}
  nav a:hover{background:var(--cream)}
  nav a.current{font-weight:700;color:#fff;background:var(--gold)}
  nav a.current:hover{color:#fff}
  .btn{background:var(--gold);color:#fff;border:none;padding:13px 20px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;display:inline-block}
  .btn:hover{color:#fff;opacity:.92}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-outline{border:1.5px solid var(--border);color:var(--brown);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;background:none;cursor:pointer}
  .btn-outline:hover{background:var(--cream)}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 32px 90px}
  .dash-grid{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
  .dash-sidebar{display:flex}
  .dash-tabs-mobile{display:none}
  @media (max-width:860px){ .dash-grid{grid-template-columns:1fr} .dash-sidebar{display:none} .dash-tabs-mobile{display:flex} }
  .tab-btn{padding:10px 18px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--brown);font-size:13.5px;font-weight:600;cursor:pointer}
  .tab-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
  .side-tab-btn{text-align:left;padding:12px 16px;border-radius:14px;border:none;background:transparent;color:var(--brown);font-size:14.5px;font-weight:600;cursor:pointer}
  .side-tab-btn.active{background:var(--gold);color:#fff;font-weight:700}
  .progress-card{background:#fff;border-radius:22px;padding:24px 26px;margin-bottom:24px}
  .progress-bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;background:var(--gold);border-radius:999px}
  .player{background:#211611;border-radius:22px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin-bottom:28px;color:#e8d3b8;overflow:hidden}
  .player iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:22px}
  .day-card{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:12px}
  .day-head{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:none;border:none;cursor:pointer;text-align:left}
  .lesson-btn{width:100%;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px 0;background:none;border:none;border-bottom:1px solid #f5ede1;text-align:left}
  .lesson-badge{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .material-row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-radius:18px;padding:18px 20px;margin-bottom:12px}
  .auth-card{max-width:400px;margin:0 auto;background:#fff;border-radius:22px;padding:32px}
  .auth-tabs{display:flex;gap:8px;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:13px;font-weight:600;color:var(--brown)}
  .field input{padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--gold)}
  .auth-error{font-size:13px;color:#b3392f;margin-bottom:14px}
  .course-card{background:#fff;border-radius:18px;padding:22px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .pending-badge{display:inline-flex;align-items:center;gap:6px;background:var(--cream);color:var(--gold);font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px}
  .cert-card{background:#fff;border-radius:22px;padding:36px;text-align:center}
  @media print{ header,.dash-sidebar,.dash-tabs-mobile,.no-print{display:none !important} .wrap{padding:0} }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="uploads/raabta-logo-color-primario.png" alt="Raabta Beauty Academy" style="height:50px;width:auto">
    <nav>
      <a href="index.html">Inicio</a>
      <a href="index.html#belleza">Belleza</a>
      <a href="salon.html">Salón</a>
      <a href="academia.html" class="current">Academia</a>
    </nav>
    <span id="userBar"></span>
  </div>
</header>

<section class="wrap">
  <div id="app">Cargando…</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/catalog.js"></script>
<script>
// Fase 4: dashboard real de alumna — 3 estados: sin sesión (login/registro),
// con sesión sin inscripción activa (solicitar inscripción a un curso), y con
// sesión + inscripción activa (temario real, progreso vía RPC, certificado).
const app = document.getElementById('app');
const userBar = document.getElementById('userBar');
const params = new URLSearchParams(location.search);
const preselectCourseId = params.get('course');

let session = null;
let authView = 'login'; // 'login' | 'signup'
let authError = null;

function renderUserBar(){
  if (!session) { userBar.innerHTML = ''; return; }
  userBar.innerHTML = `<button class="btn-outline" id="signOutBtn" style="padding:9px 16px;font-size:13px">Cerrar sesión</button>`;
  document.getElementById('signOutBtn').onclick = async () => {
    await catalogClient.auth.signOut();
  };
}

function renderAuth(){
  app.innerHTML = `
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn ${authView === 'login' ? 'active' : ''}" id="tabLogin">Ingresar</button>
        <button class="tab-btn ${authView === 'signup' ? 'active' : ''}" id="tabSignup">Crear cuenta</button>
      </div>
      ${authError ? `<p class="auth-error">${authError}</p>` : ''}
      <form id="authForm">
        ${authView === 'signup' ? `
          <div class="field"><label>Nombre completo</label><input id="fFullName" required></div>
          <div class="field"><label>Teléfono (WhatsApp)</label><input id="fPhone" required placeholder="9XXXXXXXX"></div>
        ` : ''}
        <div class="field"><label>Correo</label><input id="fEmail" type="email" required></div>
        <div class="field"><label>Contraseña</label><input id="fPassword" type="password" required minlength="6"></div>
        <button type="submit" class="btn" style="width:100%" id="authSubmit">${authView === 'signup' ? 'Crear cuenta' : 'Ingresar'}</button>
      </form>
    </div>`;
  document.getElementById('tabLogin').onclick = () => { authView = 'login'; authError = null; renderAuth(); };
  document.getElementById('tabSignup').onclick = () => { authView = 'signup'; authError = null; renderAuth(); };
  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('fEmail').value.trim();
    const password = document.getElementById('fPassword').value;
    const submitBtn = document.getElementById('authSubmit');
    submitBtn.disabled = true;
    authError = null;
    try {
      if (authView === 'signup') {
        const fullName = document.getElementById('fFullName').value.trim();
        const phone = document.getElementById('fPhone').value.trim();
        const { error } = await catalogClient.auth.signUp({
          email, password,
          options: { data: { full_name: fullName, phone } }
        });
        if (error) throw error;
      } else {
        const { error } = await catalogClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      authError = err.message === 'Invalid login credentials'
        ? 'Correo o contraseña incorrectos.'
        : (err.message || 'Ocurrió un error, intenta de nuevo.');
      submitBtn.disabled = false;
      renderAuth();
    }
  };
}

async function renderCourseRequest(){
  app.innerHTML = 'Cargando cursos…';
  const [{ data: courses, error: cErr }, { data: myEnrollments, error: eErr }] = await Promise.all([
    catalogClient.from('courses').select('*').eq('active', true).order('sort_order'),
    catalogClient.from('enrollments').select('*').eq('student_id', session.user.id)
  ]);
  if (cErr || eErr) { app.innerHTML = '<p>No se pudieron cargar los cursos.</p>'; return; }
  const byCourse = Object.fromEntries((myEnrollments || []).map(e => [e.course_id, e]));

  app.innerHTML = `
    <div style="margin-bottom:22px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)">Academia Raabta</span>
      <h1 style="font-size:32px;margin:6px 0 0">Elige tu curso</h1>
      <p style="color:var(--muted);font-size:14.5px;margin-top:8px">Solicita tu inscripción y te confirmamos por WhatsApp.</p>
    </div>
    <div id="courseList"></div>`;

  const list = document.getElementById('courseList');
  if (!courses.length) {
    list.innerHTML = '<p style="color:var(--muted)">Todavía no hay cursos publicados.</p>';
    return;
  }
  list.innerHTML = courses.map(c => {
    const existing = byCourse[c.id];
    const highlight = c.id === preselectCourseId ? 'border:2px solid var(--gold)' : '';
    let action;
    if (!existing) {
      action = `<button class="btn" data-course="${c.id}">Solicitar inscripción</button>`;
    } else if (existing.status === 'pending') {
      action = `<span class="pending-badge">⏳ Pendiente de confirmación</span>`;
    } else if (existing.status === 'cancelled') {
      action = `<button class="btn" data-course="${c.id}">Solicitar de nuevo</button>`;
    } else {
      action = `<span class="pending-badge">✓ ${existing.status === 'completed' ? 'Completado' : 'Inscrita'}</span>`;
    }
    return `<div class="course-card" style="${highlight}">
      <div>
        <div style="font-weight:700;color:var(--brown)">${c.icon} ${c.title}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">${c.meta}</div>
      </div>
      ${action}
    </div>`;
  }).join('');

  list.querySelectorAll('button[data-course]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      const { error } = await catalogClient.from('enrollments').upsert(
        { student_id: session.user.id, course_id: btn.dataset.course, status: 'pending', requested_at: new Date().toISOString(), decided_at: null },
        { onConflict: 'student_id,course_id' }
      );
      if (error) {
        btn.disabled = false;
        btn.textContent = 'Solicitar inscripción';
        alert('No se pudo enviar la solicitud. Intenta de nuevo o escríbenos por WhatsApp.');
        return;
      }
      renderCourseRequest();
    };
  });
}

async function renderStudyDashboard(activeEnrollment, courseTitle){
  const courseId = activeEnrollment.course_id;
  const [{ data: days }, { data: lessonsRaw }, { data: materials }, { data: progressRows }, { data: certRows }] = await Promise.all([
    catalogClient.from('course_days').select('*').eq('course_id', courseId).order('sort_order'),
    catalogClient.from('course_lessons').select('*, course_days!inner(course_id)').eq('course_days.course_id', courseId).order('sort_order'),
    catalogClient.from('course_materials').select('*').eq('course_id', courseId).order('sort_order'),
    catalogClient.from('lesson_progress').select('lesson_id').eq('student_id', session.user.id),
    catalogClient.from('certificates').select('*').eq('student_id', session.user.id).eq('course_id', courseId)
  ]);

  const lessons = (lessonsRaw || []).map(({ course_days, ...l }) => l);
  const completedSet = new Set((progressRows || []).map(p => p.lesson_id));
  const certificate = certRows && certRows[0] ? certRows[0] : null;
  const allLessons = lessons; // ya viene ordenado por sort_order
  const state = {
    tab: 'curso',
    expandedDay: days && days[0] ? days[0].id : null,
    currentLessonId: (allLessons.find(l => !completedSet.has(l.id)) || allLessons[allLessons.length - 1] || {}).id
  };

  function renderTabs(){
    const tabDefs = [
      { key: 'curso', label: 'Mi curso' },
      { key: 'materiales', label: 'Materiales' },
      { key: 'certificado', label: 'Certificado' }
    ];
    let mobile = '', desktop = '';
    tabDefs.forEach(t => {
      const active = state.tab === t.key;
      mobile += `<button class="tab-btn ${active ? 'active' : ''}" style="flex-shrink:0" data-tab="${t.key}">${t.label}</button>`;
      desktop += `<button class="side-tab-btn ${active ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>`;
    });
    document.getElementById('tabsMobile').innerHTML = mobile;
    document.getElementById('tabsDesktop').innerHTML = desktop;
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
    });
  }

  function renderCurso(){
    const total = allLessons.length;
    const doneCount = allLessons.filter(l => completedSet.has(l.id)).length;
    const progressPct = total ? Math.round((doneCount / total) * 100) : 0;
    const current = allLessons.find(l => l.id === state.currentLessonId) || allLessons[0];
    const currentDay = days.find(d => current && d.id === current.day_id);
    const isCurrentDone = current && completedSet.has(current.id);

    let html = `<div class="progress-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:14px;font-weight:600;color:var(--brown)">Progreso general</span>
        <span style="font-size:14px;font-weight:700;color:var(--gold)">${progressPct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </div>`;

    if (current) {
      if (current.modality === 'Video' && current.video_url) {
        html += `<div class="player"><iframe src="${current.video_url}" allowfullscreen></iframe></div>`;
      } else {
        html += `<div class="player">
          <div style="width:64px;height:64px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:26px">▶</div>
          <div style="text-align:center">
            <div style="font-size:14.5px;font-weight:600">${current.title}</div>
            <div style="font-size:12.5px;color:#c3a888;margin-top:2px">${currentDay ? currentDay.title.split(' · ')[0] : ''} · ${current.duration}</div>
          </div>
        </div>`;
      }
      html += `<div style="margin:-16px 0 28px">
        <button class="btn" id="completeBtn" ${isCurrentDone ? 'disabled' : ''}>${isCurrentDone ? '✓ Lección completada' : 'Marcar como completada'}</button>
      </div>`;
    }

    html += '<h3 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px">Temario</h3>';

    (days || []).forEach(d => {
      const dayLessons = allLessons.filter(l => l.day_id === d.id);
      const doneInDay = dayLessons.filter(l => completedSet.has(l.id)).length;
      const expanded = state.expandedDay === d.id;
      html += `<div class="day-card">
        <button class="day-head" data-day="${d.id}">
          <div>
            <div style="font-size:15px;font-weight:700;color:var(--ink)">${d.title}</div>
            <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${doneInDay}/${dayLessons.length} clases completadas</div>
          </div>
          <span style="font-size:16px;color:var(--gold);display:inline-block;transform:rotate(${expanded ? 180 : 0}deg);transition:transform .15s">⌄</span>
        </button>`;
      if (expanded) {
        html += '<div style="border-top:1px solid var(--line);padding:6px 20px 14px">';
        dayLessons.forEach(l => {
          const done = completedSet.has(l.id);
          const isCurrent = l.id === state.currentLessonId;
          const locked = !done && !isCurrent;
          const badgeBg = done ? 'var(--gold)' : isCurrent ? 'var(--cream)' : '#f5ede1';
          const badgeColor = done ? '#fff' : isCurrent ? 'var(--gold)' : '#c9b8a3';
          const badgeIcon = done ? '✓' : isCurrent ? '▶' : '🔒';
          const textColor = locked ? '#c9b8a3' : 'var(--ink)';
          html += `<button class="lesson-btn" style="cursor:${locked ? 'not-allowed' : 'pointer'}" data-lesson="${l.id}" data-locked="${locked}">
            <div class="lesson-badge" style="background:${badgeBg};color:${badgeColor}">${badgeIcon}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:600;color:${textColor}">${l.title}</div>
              <div style="font-size:12px;color:#a89886">${l.modality} · ${l.duration}</div>
            </div>
          </button>`;
        });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function renderMateriales(){
    if (!materials || !materials.length) {
      return '<p style="color:var(--muted);font-size:14px">Todavía no hay materiales para este curso.</p>';
    }
    let html = '<h3 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px">Materiales descargables</h3>';
    materials.forEach(m => {
      html += `<div class="material-row">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold)">📄</div>
          <div><div style="font-size:14.5px;font-weight:600;color:var(--ink)">${m.name}</div><div style="font-size:12.5px;color:var(--muted)">${m.meta}</div></div>
        </div>
        <a href="${m.file_url}" target="_blank" rel="noreferrer" class="btn" style="padding:10px 20px;font-size:13px">Descargar</a>
      </div>`;
    });
    return html;
  }

  function renderCertificado(){
    const total = allLessons.length;
    const doneCount = allLessons.filter(l => completedSet.has(l.id)).length;
    const progressPct = total ? Math.round((doneCount / total) * 100) : 0;
    if (certificate) {
      return `<div class="cert-card">
        <div style="width:200px;height:150px;margin:0 auto 22px;border-radius:16px;border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--gold)">🏆</div>
        <h3 style="font-size:22px;margin:0 0 8px">Certificado de ${courseTitle}</h3>
        <p style="font-size:14px;color:var(--muted);margin:0 0 6px">¡Felicidades! Completaste el curso.</p>
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 20px">Código de verificación: <strong>${certificate.code}</strong></p>
        <button class="btn no-print" onclick="window.print()">Imprimir / guardar certificado</button>
      </div>`;
    }
    return `<div class="cert-card">
      <div style="width:200px;height:150px;margin:0 auto 22px;border-radius:16px;border:2px dashed #e0d3bd;display:flex;align-items:center;justify-content:center;font-size:40px;color:#e0d3bd">🔒</div>
      <h3 style="font-size:22px;margin:0 0 8px">Certificado de ${courseTitle}</h3>
      <p style="font-size:14px;color:var(--muted);margin:0">Completa el 100% del curso para desbloquear tu certificado. Progreso actual: ${progressPct}%.</p>
    </div>`;
  }

  function bindContentEvents(){
    document.querySelectorAll('[data-day]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.day;
        state.expandedDay = state.expandedDay === id ? null : id;
        render();
      };
    });
    document.querySelectorAll('[data-lesson]').forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.locked === 'true') return;
        state.currentLessonId = btn.dataset.lesson;
        render();
      };
    });
    const completeBtn = document.getElementById('completeBtn');
    if (completeBtn) {
      completeBtn.onclick = async () => {
        completeBtn.disabled = true;
        completeBtn.textContent = 'Guardando…';
        const { error } = await catalogClient.rpc('mark_lesson_complete', { p_lesson_id: state.currentLessonId });
        if (error) {
          alert('No se pudo guardar tu progreso. Intenta de nuevo.');
          completeBtn.disabled = false;
          completeBtn.textContent = 'Marcar como completada';
          return;
        }
        renderStudyDashboard(activeEnrollment, courseTitle);
      };
    }
  }

  function render(){
    renderTabs();
    let html = '';
    if (state.tab === 'curso') html = renderCurso();
    else if (state.tab === 'materiales') html = renderMateriales();
    else if (state.tab === 'certificado') html = renderCertificado();
    document.getElementById('tabContent').innerHTML = html;
    bindContentEvents();
  }

  app.innerHTML = `
    <div style="margin-bottom:22px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)">Academia · Mi curso</span>
      <h1 style="font-size:32px;margin:6px 0 0">${courseTitle}</h1>
    </div>
    <div class="dash-tabs-mobile" id="tabsMobile" style="gap:8px;margin-bottom:20px;overflow-x:auto"></div>
    <div class="dash-grid">
      <aside class="dash-sidebar" id="tabsDesktop" style="flex-direction:column;gap:6px"></aside>
      <div id="tabContent"></div>
    </div>`;
  render();
}

async function renderLoggedIn(){
  app.innerHTML = 'Cargando…';
  const { data: enrollments, error } = await catalogClient
    .from('enrollments')
    .select('*, courses(title)')
    .eq('student_id', session.user.id)
    .eq('status', 'active');
  if (error) { app.innerHTML = '<p>No se pudo cargar tu información.</p>'; return; }

  if (!enrollments.length) {
    renderCourseRequest();
    return;
  }

  const active = enrollments.length === 1
    ? enrollments[0]
    : (enrollments.find(e => e.course_id === preselectCourseId) || enrollments[0]);

  if (enrollments.length > 1) {
    const switcher = document.createElement('div');
    switcher.style.marginBottom = '16px';
    switcher.innerHTML = enrollments.map(e =>
      `<button class="tab-btn ${e.course_id === active.course_id ? 'active' : ''}" data-switch="${e.course_id}" style="margin-right:8px">${e.courses.title}</button>`
    ).join('');
    app.innerHTML = '';
    app.appendChild(switcher);
    const holder = document.createElement('div');
    app.appendChild(holder);
    switcher.querySelectorAll('[data-switch]').forEach(btn => {
      btn.onclick = () => {
        const chosen = enrollments.find(e => e.course_id === btn.dataset.switch);
        params.set('course', chosen.course_id);
        renderStudyDashboard(chosen, chosen.courses.title);
      };
    });
    await renderStudyDashboard(active, active.courses.title);
    return;
  }

  await renderStudyDashboard(active, active.courses.title);
}

async function route(){
  renderUserBar();
  if (!session) {
    renderAuth();
    return;
  }
  await renderLoggedIn();
}

catalogClient.auth.getSession().then(({ data }) => {
  session = data.session;
  route();
});
catalogClient.auth.onAuthStateChange((_event, newSession) => {
  session = newSession;
  route();
});
</script>
