<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar cita — Raabta Beauty Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif:opsz@12..24&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fdf7ef; --ink:#3f3126; --brown:#633b2c; --gold:#a47234; --cream:#f7ecdf; --muted:#7a685d; --line:#f0e4d3; --border:#ecdcc6; --serif:'Hedvig Letters Serif',serif; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',sans-serif;background:var(--bg);color:var(--ink)}
  a{color:#986a3e;text-decoration:none}
  a:hover{color:var(--brown)}
  h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--brown);margin:0}
  button{font-family:inherit}
  header{position:sticky;top:0;z-index:50;background:rgba(253,247,239,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .header-inner{max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px}
  nav{display:flex;gap:8px;align-items:center}
  nav a{padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--brown)}
  nav a:hover{background:var(--cream)}
  nav a.current{font-weight:700;color:#fff;background:var(--gold)}
  nav a.current:hover{color:#fff}
  .reserva-grid{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start;max-width:1180px;margin:0 auto;padding:32px 32px 90px;box-sizing:border-box}
  .reserva-aside{position:sticky;top:96px}
  @media (max-width:900px){ .reserva-grid{grid-template-columns:1fr} .reserva-aside{position:static;top:auto} }
  .crumbs{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .crumbs .sep{color:#d8c5ac}
  .chip{padding:10px 18px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--brown);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.active{background:var(--brown);color:#fff;border-color:var(--brown)}
  .svc-card{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:20px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .svc-card.selected{border-color:var(--gold)}
  .svc-cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .svc-name{font-size:16px;font-weight:600;color:var(--ink)}
  .svc-dur{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
  .svc-desc{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;max-width:520px}
  .svc-price{font-size:16px;font-weight:700;color:var(--brown);margin-top:12px}
  .svc-toggle{flex-shrink:0;width:38px;height:38px;border-radius:999px;border:none;background:var(--cream);color:var(--gold);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .svc-toggle.selected{background:var(--gold);color:#fff}
  .day-btn{flex-shrink:0;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px;border-radius:16px;border:1.5px solid var(--border);background:#fff;color:var(--ink);cursor:pointer}
  .day-btn:disabled{background:#f5efe6;color:#c9b8a3;cursor:not-allowed;border-color:var(--line)}
  .day-btn.selected{background:var(--gold);color:#fff;border-color:var(--gold)}
  .day-wd{font-size:12px;font-weight:600;text-transform:lowercase}
  .day-num{font-size:19px;font-weight:700}
  .day-mo{font-size:10.5px;text-transform:lowercase}
  .nav-arrow{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--brown);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .time-btn{width:100%;box-sizing:border-box;text-align:left;padding:16px 20px;border-radius:16px;border:1.5px solid var(--border);background:#fff;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
  .time-btn.selected{background:var(--gold);color:#fff;border-color:var(--gold)}
  .fv-btn{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;cursor:pointer}
  .fv-btn.selected{border-color:var(--gold)}
  .fv-title{font-size:15.5px;font-weight:600;color:var(--ink)}
  .fv-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .field label{font-size:13px;font-weight:600;color:var(--brown);display:block;margin-bottom:6px}
  .field input, .field textarea{width:100%;box-sizing:border-box;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;font-family:inherit}
  .aside-box{background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(99,59,44,.1);padding:22px;display:flex;flex-direction:column;gap:16px}
  .aside-hr{border-top:1px solid var(--line)}
  .btn{background:var(--gold);color:#fff;border:none;padding:13px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-outline{background:none;border:1.5px solid var(--border);color:var(--brown);padding:13px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
  .overlay{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#f0c98a,#a47234 45%,#5c3a22 100%);background-size:200% 200%;animation:bgDrift 8s ease-in-out infinite alternate}
  .overlay.show{display:flex}
  @keyframes bgDrift{0%{background-position:0% 0%}100%{background-position:100% 100%}}
  @keyframes confettiZoom{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:scale(1)}}
  .confirm-card{animation:confettiZoom .5s cubic-bezier(.2,.8,.2,1);background:#fff;border-radius:28px;padding:44px 40px;max-width:420px;width:88%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal-backdrop{position:fixed;inset:0;background:rgba(63,49,38,.4);z-index:80;display:none;align-items:center;justify-content:center}
  .modal-backdrop.show{display:flex}
  .modal-card{background:#fff;border-radius:22px;padding:26px;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="uploads/raabta-logo-color-primario.png" alt="Raabta Beauty Academy" style="height:50px;width:auto">
    <nav>
      <a href="index.html">Inicio</a>
      <a href="index.html#belleza">Belleza</a>
      <a href="salon.html" class="current">Salón</a>
      <a href="academia.html">Academia</a>
    </nav>
  </div>
</header>

<section class="reserva-grid">
  <div id="mainContent" style="min-width:0"></div>
  <aside class="reserva-aside" id="sidebar"></aside>
</section>

<div class="overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div style="width:76px;height:76px;border-radius:999px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 22px">✓</div>
    <h2 style="font-size:30px;margin:0 0 12px">¡Solicitud enviada!</h2>
    <p style="font-size:14.5px;color:var(--muted);margin:0 0 28px">Te escribiremos al WhatsApp <span id="confirmPhone"></span> para coordinar el adelanto y confirmar tu cita.</p>
    <a href="citas.html" class="btn" style="display:inline-block">Ver mi cita</a>
  </div>
</div>

<div class="modal-backdrop" id="commentBackdrop">
  <div class="modal-card">
    <h3 style="font-size:22px;margin:0 0 14px">¿Algo que quieras que sepamos?</h3>
    <textarea id="commentInput" placeholder="Ej. Soy alérgica a..." rows="4" style="width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;font-family:inherit;resize:vertical"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
      <button class="btn-outline" onclick="closeCommentModal()">Cancelar</button>
      <button class="btn" onclick="saveComment()">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/catalog.js"></script>
<script>
// Fase 8: la disponibilidad real y la reserva misma pasan por el bot (mismo
// motor que usa WhatsApp), no por un insert directo a Supabase — así una
// reserva web y una por WhatsApp compiten por el mismo horario de verdad,
// en vez de vivir en dos tablas que nunca se enteran una de la otra.
const BOT_API_URL = "https://bot.raabtastudio.com";
const supabaseClient = catalogClient;

// Fase 3: se carga de forma async desde Supabase (ver init() al final del archivo).
let SERVICE_GROUPS = [];
const WEEKDAYS = ["dom","lun","mar","mié","jue","vie","sáb"];
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtPrice(p){ return "S/ " + p; }

const state = {
  step: 1, activeCategory: "Todos", serviceIds: [],
  dayOffset: 0, dateIdx: null, time: null, firstVisit: null,
  formName: "", formPhone: "", comment: "", draftComment: "", confirmed: false,
  submitting: false, submitError: null,
  // fecha ISO -> string[] de horas HH:mm libres, según lo último que devolvió el bot.
  disponibilidad: {}, dispLoading: false, dispError: false
};

/** Trae disponibilidad real para los servicios elegidos, sobre el rango de días visible. */
async function cargarDisponibilidad(){
  if (state.serviceIds.length === 0) return;
  state.dispLoading = true;
  state.dispError = false;
  render();
  const days = getDays();
  const desde = toISODate(days[0]);
  const hasta = toISODate(days[days.length - 1]);
  try {
    const url = `${BOT_API_URL}/public/disponibilidad?servicio_ids=${encodeURIComponent(state.serviceIds.join(','))}&fecha_desde=${desde}&fecha_hasta=${hasta}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad_status');
    const data = await res.json();
    const mapa = {};
    data.forEach(d => { mapa[d.fecha] = d.horas; });
    state.disponibilidad = mapa;
  } catch (e) {
    state.dispError = true;
  }
  state.dispLoading = false;
  render();
}

function findServices(){
  const list = [];
  SERVICE_GROUPS.forEach(g => g.services.forEach(s => { if (state.serviceIds.includes(s.id)) list.push(s); }));
  return list;
}
function toggleService(id){
  state.serviceIds = state.serviceIds.includes(id) ? state.serviceIds.filter(x => x !== id) : [...state.serviceIds, id];
  render();
}
function selectCategory(c){ state.activeCategory = c; render(); }

function getDays(){
  const today = new Date();
  const days = [];
  for (let i = 0; i < 10; i++) {
    const day = new Date(today);
    day.setDate(today.getDate() + state.dayOffset + i);
    days.push(day);
  }
  return days;
}
function selectDay(i, sinCupo){ if (sinCupo) return; state.dateIdx = i; state.time = null; render(); }
function scrollDaysBack(){ state.dayOffset = Math.max(0, state.dayOffset - 6); state.dateIdx = null; state.time = null; cargarDisponibilidad(); }
function scrollDaysFwd(){ state.dayOffset += 6; state.dateIdx = null; state.time = null; cargarDisponibilidad(); }
function selectTime(h){ state.time = h; render(); }
function selectFirstVisit(k){ state.firstVisit = k; render(); }

function refreshNextButton(){
  const selectedServices = findServices();
  const canNext4 = state.formName.trim().length > 1 && state.formPhone.trim().length >= 6;
  const btn = document.getElementById('nextBtn');
  if (btn && state.step === 4) { btn.disabled = !canNext4; btn.style.opacity = canNext4 ? 1 : 0.5; }
}
function openCommentModal(){
  state.draftComment = state.comment;
  document.getElementById('commentInput').value = state.comment;
  document.getElementById('commentBackdrop').classList.add('show');
}
function closeCommentModal(){ document.getElementById('commentBackdrop').classList.remove('show'); }
function saveComment(){
  state.comment = document.getElementById('commentInput').value;
  closeCommentModal();
  render();
}

function goBack(){ state.step = Math.max(1, state.step - 1); render(); }
function toISODate(day){
  const y = day.getFullYear(), m = String(day.getMonth() + 1).padStart(2, '0'), d = String(day.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
/** "987654321" o "+51 987 654 321" -> "51987654321", el mismo formato que usa el bot de WhatsApp. */
function normalizarTelefono(raw){
  const soloDigitos = raw.replace(/\D/g, '');
  return soloDigitos.startsWith('51') ? soloDigitos : `51${soloDigitos}`;
}

async function submitBooking(){
  state.submitting = true;
  state.submitError = null;
  render();
  const days = getDays();
  try {
    const res = await fetch(`${BOT_API_URL}/public/reservas`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        servicio_ids: state.serviceIds,
        fecha: toISODate(days[state.dateIdx]),
        hora: state.time,
        nombre: state.formName.trim(),
        telefono: normalizarTelefono(state.formPhone.trim()),
        primera_visita: state.firstVisit === 'si' ? true : state.firstVisit === 'no' ? false : null,
        comentario: state.comment || undefined
      })
    });
    if (res.status === 409) {
      // Alguien más tomó ese horario justo ahora (WhatsApp u otra pestaña) —
      // se refresca la disponibilidad real en vez de dejar seleccionado un
      // horario que ya no existe.
      state.submitting = false;
      state.submitError = 'Ese horario ya no está disponible, se acaba de ocupar. Elige otro.';
      state.step = 2;
      state.time = null;
      await cargarDisponibilidad();
      return;
    }
    if (!res.ok) throw new Error('bad_status');
  } catch (e) {
    state.submitting = false;
    state.submitError = 'No se pudo enviar tu solicitud. Revisa tu conexión e inténtalo de nuevo.';
    render();
    return;
  }
  state.submitting = false;
  state.confirmed = true;
  document.getElementById('confirmPhone').textContent = state.formPhone;
  document.getElementById('confirmOverlay').classList.add('show');
  render();
}
function goNext(){
  const selectedServices = findServices();
  const canNext1 = selectedServices.length > 0;
  const canNext2 = state.dateIdx != null && !!state.time;
  const canNext3 = !!state.firstVisit;
  const canNext4 = state.formName.trim().length > 1 && state.formPhone.trim().length >= 6;
  if (state.step === 1 && canNext1) { state.step = 2; render(); cargarDisponibilidad(); }
  else if (state.step === 2 && canNext2) { state.step = 3; render(); }
  else if (state.step === 3 && canNext3) { state.step = 4; render(); }
  else if (state.step === 4 && canNext4 && !state.submitting) { submitBooking(); }
}

function renderStep1(){
  const cats = ["Todos", "Principales", "Complementarios", "Opcionales"];
  let html = '<h1>Seleccionar servicio</h1><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">';
  cats.forEach(c => {
    html += `<button class="chip ${state.activeCategory === c ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>`;
  });
  html += '</div><div style="display:flex;flex-direction:column;gap:14px">';
  SERVICE_GROUPS.forEach(g => {
    if (state.activeCategory !== "Todos" && state.activeCategory !== g.title) return;
    g.services.forEach(s => {
      const selected = state.serviceIds.includes(s.id);
      html += `
        <div class="svc-card ${selected ? 'selected' : ''}">
          <div style="flex:1">
            <div class="svc-cat">${g.title}</div>
            <div class="svc-name">${s.name}</div>
            <div class="svc-dur">${s.duration}</div>
            <p class="svc-desc">${s.description}</p>
            <div class="svc-price">${fmtPrice(s.price)}</div>
          </div>
          <button class="svc-toggle ${selected ? 'selected' : ''}" aria-label="Añadir servicio" onclick="toggleService('${s.id}')">${selected ? '✓' : '+'}</button>
        </div>`;
    });
  });
  html += '</div>';
  return html;
}

function renderStep2(){
  const days = getDays();
  let html = '<h1>Seleccionar fecha y hora</h1>';
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <h3 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0">Selecciona una fecha</h3>
    <div style="display:flex;gap:6px">
      <button class="nav-arrow" aria-label="Anterior" onclick="scrollDaysBack()">‹</button>
      <button class="nav-arrow" aria-label="Siguiente" onclick="scrollDaysFwd()">›</button>
    </div>
  </div>`;
  html += '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:28px;min-width:0">';
  days.forEach((day, i) => {
    const iso = toISODate(day);
    const horasDia = state.disponibilidad[iso];
    const sinCupo = !state.dispLoading && Array.isArray(horasDia) && horasDia.length === 0;
    const selected = state.dateIdx === i;
    html += `<button class="day-btn ${selected ? 'selected' : ''}" ${sinCupo ? 'disabled' : ''} onclick="selectDay(${i}, ${sinCupo})">
      <span class="day-wd">${WEEKDAYS[day.getDay()]}</span>
      <span class="day-num">${day.getDate()}</span>
      <span class="day-mo">${MONTHS[day.getMonth()]}</span>
    </button>`;
  });
  html += '</div>';
  html += '<h3 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 14px">Escoge una hora</h3>';
  if (state.dispError) {
    html += '<p style="font-size:14px;color:#b3392f">No se pudo cargar la disponibilidad. <button class="btn-outline" onclick="cargarDisponibilidad()">Reintentar</button></p>';
  } else if (state.dispLoading) {
    html += '<p style="font-size:14px;color:#a89886">Consultando horarios disponibles…</p>';
  } else if (state.dateIdx != null) {
    const dayHours = state.disponibilidad[toISODate(days[state.dateIdx])] || [];
    if (dayHours.length > 0) {
      html += '<div style="display:flex;flex-direction:column;gap:10px">';
      dayHours.forEach(h => {
        html += `<button class="time-btn ${state.time === h ? 'selected' : ''}" onclick="selectTime('${h}')">${h}</button>`;
      });
      html += '</div>';
    } else {
      html += '<p style="font-size:14px;color:#a89886">No hay horas disponibles ese día. Elige otra fecha.</p>';
    }
  }
  return html;
}

function renderStep3(){
  const opts = [
    { key: "si", title: "Sí", subtitle: "Esta es mi primera visita" },
    { key: "no", title: "No", subtitle: "No es mi primera visita" }
  ];
  let html = '<h1 style="font-size:32px">¿Es tu primera visita a Raabta Beauty Academy?</h1><div style="display:flex;flex-direction:column;gap:14px;max-width:520px;margin-top:24px">';
  opts.forEach(o => {
    html += `<button class="fv-btn ${state.firstVisit === o.key ? 'selected' : ''}" onclick="selectFirstVisit('${o.key}')">
      <div class="fv-title">${o.title}</div><div class="fv-sub">${o.subtitle}</div>
    </button>`;
  });
  html += '</div>';
  return html;
}

function renderStep4(){
  const hasComment = !!state.comment;
  let html = '<h1>Revisar y confirmar</h1>';
  html += '<h3 style="font-size:15px;margin:0 0 12px">Tus datos</h3>';
  html += `<div style="display:flex;flex-direction:column;gap:14px;max-width:420px;margin-bottom:28px">
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="nameInput" value="${state.formName}" placeholder="Ej. María Gómez" oninput="state.formName=this.value; refreshNextButton();">
    </div>
    <div class="field">
      <label>WhatsApp</label>
      <input type="tel" id="phoneInput" value="${state.formPhone}" placeholder="9XX XXX XXX" oninput="state.formPhone=this.value; refreshNextButton();">
    </div>
  </div>`;
  html += '<h3 style="font-size:15px;margin:0 0 12px">Más detalles</h3>';
  html += `<div style="background:#fff;border-radius:18px;padding:20px 22px;margin-bottom:24px">
    <div style="font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px">Política de cancelación</div>
    <div style="font-size:13.5px;color:var(--muted)">Cancela la cita con al menos 30 minutos de antelación.</div>
  </div>`;
  html += '<h3 style="font-size:15px;margin:0 0 12px">Comentarios o solicitudes</h3>';
  html += `<div style="background:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:600px">
    <span style="font-size:14px;color:${hasComment ? 'var(--ink)' : '#a89886'}">${hasComment ? state.comment : '¿Algo que quieras que sepamos?'}</span>
    <button class="btn-outline" style="flex-shrink:0;padding:9px 18px;font-size:13.5px" onclick="openCommentModal()">${hasComment ? 'Editar' : 'Añadir'}</button>
  </div>`;
  html += `<div style="display:flex;gap:10px;align-items:flex-start;background:var(--cream);border-radius:14px;padding:14px 16px;margin-top:24px;max-width:600px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg>
    <p style="font-size:13px;color:var(--brown);line-height:1.5;margin:0">Para confirmar tu cita se requiere un adelanto. Te contactaremos por WhatsApp para coordinarlo.</p>
  </div>`;
  return html;
}

function renderSidebar(){
  const selectedServices = findServices();
  const days = getDays();
  const hasSelection = selectedServices.length > 0;
  const hasDateTime = state.dateIdx != null && !!state.time;
  const isNumericPrice = p => /^\d+(\.\d+)?$/.test(String(p));
  const totalPrice = selectedServices.reduce((sum, s) => sum + (isNumericPrice(s.price) ? Number(s.price) : 0), 0);
  const hasRangePrice = selectedServices.some(s => !isNumericPrice(s.price));
  const totalDuration = selectedServices.map(s => s.duration).filter(d => d !== "—").join(" + ") || "—";

  const canNext1 = selectedServices.length > 0;
  const canNext2 = state.dateIdx != null && !!state.time;
  const canNext3 = !!state.firstVisit;
  const canNext4 = state.formName.trim().length > 1 && state.formPhone.trim().length >= 6;
  let nextDisabled = false, nextLabel = "Continuar";
  if (state.step === 1) nextDisabled = !canNext1;
  if (state.step === 2) nextDisabled = !canNext2;
  if (state.step === 3) nextDisabled = !canNext3;
  if (state.step === 4) { nextDisabled = !canNext4 || state.submitting; nextLabel = state.submitting ? "Enviando…" : "Enviar solicitud"; }

  let html = `<div class="aside-box">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="uploads/raabta-logo-color-primario.png" style="width:44px;height:44px;object-fit:contain;background:var(--bg);border-radius:12px;padding:4px">
      <div>
        <div style="font-size:14.5px;font-weight:700;color:var(--brown)">Raabta Beauty Academy</div>
        <div style="font-size:12px;color:var(--muted)">Av. José Santos Chocano 1330, Los Olivos</div>
      </div>
    </div>
    <div class="aside-hr"></div>`;

  if (hasDateTime) {
    html += `<div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
        <span style="font-size:13.5px;color:var(--ink);font-weight:600">${WEEKDAYS[days[state.dateIdx].getDay()]} ${days[state.dateIdx].getDate()} ${MONTHS[days[state.dateIdx].getMonth()]}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <span style="font-size:13.5px;color:var(--ink);font-weight:600">${state.time} (${totalDuration} de duración)</span>
      </div>
    </div><div class="aside-hr"></div>`;
  }

  if (hasSelection) {
    html += '<div style="display:flex;flex-direction:column;gap:12px">';
    selectedServices.forEach(s => {
      html += `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
        <div><div style="font-size:14.5px;font-weight:600;color:var(--ink)">${s.name}</div><div style="font-size:12.5px;color:var(--muted);margin-top:2px">${s.duration}</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:14.5px;font-weight:700;color:var(--brown);white-space:nowrap">${fmtPrice(s.price)}</span>
          <button aria-label="Quitar" style="background:none;border:none;color:#c9b8a3;font-size:16px;cursor:pointer;line-height:1;padding:0" onclick="toggleService('${s.id}')">✕</button>
        </div>
      </div>`;
    });
    html += '</div>';
  } else {
    html += '<p style="font-size:13.5px;color:#a89886;margin:0">Elige un servicio para comenzar tu reserva.</p>';
  }

  if (hasSelection) {
    html += `<div style="border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between">
      <span style="font-size:15px;font-weight:600;color:var(--brown)">Total</span>
      <span style="font-size:16px;font-weight:700;color:var(--gold)">${(hasRangePrice ? "desde " : "") + fmtPrice(totalPrice)}</span>
    </div>`;
  }

  if (state.step === 4 && state.submitError) {
    html += `<p style="font-size:13px;color:#b3392f;margin:0">${state.submitError}</p>`;
  }
  html += '<div style="display:flex;gap:10px;margin-top:4px">';
  if (state.step > 1) html += `<button class="btn-outline" style="flex-shrink:0" ${state.submitting ? 'disabled' : ''} onclick="goBack()">Atrás</button>`;
  html += `<button class="btn" id="nextBtn" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px" ${nextDisabled ? 'disabled' : ''} onclick="goNext()">${nextLabel} →</button>`;
  html += '</div></div>';
  return html;
}

function render(){
  const crumbLabels = ["Servicios", "Fecha y hora", "Confirmar"];
  let crumbsHtml = '<div class="crumbs">';
  crumbLabels.forEach((label, i) => {
    const n = i + 1;
    const active = state.step === n && !state.confirmed;
    const done = state.step > n || state.confirmed;
    crumbsHtml += `<span style="display:flex;align-items:center;gap:8px"><span style="font-size:13.5px;font-weight:${active ? 700 : 600};color:${active ? 'var(--brown)' : done ? 'var(--gold)' : '#c9b8a3'}">${label}</span>${i < crumbLabels.length - 1 ? '<span class="sep">›</span>' : ''}</span>`;
  });
  crumbsHtml += '</div>';

  let stepHtml = '';
  if (state.step === 1) stepHtml = renderStep1();
  else if (state.step === 2) stepHtml = renderStep2();
  else if (state.step === 3) stepHtml = renderStep3();
  else if (state.step === 4) stepHtml = renderStep4();

  document.getElementById('mainContent').innerHTML = crumbsHtml + stepHtml;
  document.getElementById('sidebar').innerHTML = state.confirmed ? '' : renderSidebar();
  document.getElementById('sidebar').style.display = state.confirmed ? 'none' : '';
}

function initFromQuery(){
  const params = new URLSearchParams(window.location.search);
  const requested = (params.get('services') || '').split(',').map(s => s.trim()).filter(Boolean);
  if (requested.length) {
    const validIds = SERVICE_GROUPS.flatMap(g => g.services.map(s => s.id));
    const matched = requested.filter(id => validIds.includes(id));
    if (matched.length) {
      state.serviceIds = matched;
      if (params.get('step') === '2') state.step = 2;
    }
  }
}

(async function init(){
  document.getElementById('mainContent').innerHTML = '<p style="color:var(--muted)">Cargando servicios…</p>';
  try {
    SERVICE_GROUPS = await fetchServiceGroups();
  } catch (e) {
    document.getElementById('mainContent').innerHTML = '<p style="color:var(--muted)">No se pudieron cargar los servicios. <button class="btn-outline" onclick="location.reload()">Reintentar</button></p>';
    document.getElementById('sidebar').style.display = 'none';
    return;
  }
  initFromQuery();
  render();
  if (state.step === 2) cargarDisponibilidad();
})();
</script>
</body>
</html>
