<script>
// La reserva ahora vive dentro de la portada, como modal. Esta página queda
// solo para no romper enlaces viejos (WhatsApp, salon.html, buscadores):
// conserva los servicios pedidos y abre el modal en index.html.
(function () {
  var params = new URLSearchParams(location.search);
  var ids = params.get("servicios") || params.get("services") || "";
  location.replace("index.html" + (ids ? "?servicios=" + encodeURIComponent(ids) : "") + "#reservar");
})();
</script>
